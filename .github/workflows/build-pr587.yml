name: Build OpenNutriTracker PR 587

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR 587
        uses: actions/checkout@v4
        with:
          ref: build-pr587

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        env:
          FDC_API_KEY: "build-only-placeholder"
        run: dart run build_runner build

      - name: Build APK
        env:
          FDC_API_KEY: "build-only-placeholder"
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNutriTracker-PR587
          path: build/app/outputs/flutter-apk/app-debug.apk
