name: Build PR 587 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opennutritracker-pr587-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: false

      - name: Create environment file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "::error file=.env.example::Required .env.example file is missing from this branch."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Run tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build APK with detailed logs
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --flavor full --debug --verbose 2>&1 | tee build-log.txt

      - name: Show APK and Gradle outputs
        if: always()
        run: |
          find build -type f \( -name '*.apk' -o -name '*gradle*' \) -print | head -200 || true
          find android -type f -name '*gradle*' -print | head -200 || true
          df -h /

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNutriTracker-build-diagnostics
          path: |
            build-log.txt
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNutriTracker-PR587-debug
          path: build/app/outputs/flutter-apk/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
